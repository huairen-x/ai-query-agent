# ============================================================
# 智能运维 Agent - K8s 部署配置
# ============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: ops-agent

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ops-agent-config
  namespace: ops-agent
data:
  config.yaml: |
    ds:
      host: "dolphinscheduler-master-0.ds"
      port: 12345
      token: ""
    k8s:
      in_cluster: true
      worker_deployment: "ds-worker"
      worker_namespace: "ds"
      default_scale_step: 2
      max_replicas: 20
      min_replicas: 3
    detection:
      timeout_ratio_threshold: 1.5
      baseline_std_threshold: 3.0
      retry_threshold: 3
      cpu_high_threshold: 85.0
      queue_depth_threshold: 100
    llm:
      provider: "deepseek"
      model: "deepseek-chat"
      temperature: 0.1
      max_tokens: 2000
    circuit_breaker:
      failure_threshold: 3
      recovery_timeout: 300
    notification:
      enable_auto_notify: true
      p0_phone_alert: true
    log_level: "INFO"
    mock_mode: false

---
apiVersion: v1
kind: Secret
metadata:
  name: ops-agent-secret
  namespace: ops-agent
type: Opaque
stringData:
  DS_TOKEN: "your-ds-token"
  LLM_API_KEY: "your-llm-api-key"
  DINGTALK_WEBHOOK: "https://oapi.dingtalk.com/robot/send?access_token=xxx"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent-core
  namespace: ops-agent
  labels:
    app: ops-agent
    component: core
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ops-agent
      component: core
  template:
    metadata:
      labels:
        app: ops-agent
        component: core
    spec:
      serviceAccountName: ops-agent-sa
      containers:
        - name: agent-core
          image: ops-agent:latest
          imagePullPolicy: Always
          args: ["--webhook", "--port", "8081"]
          ports:
            - containerPort: 8081
              protocol: TCP
          env:
            - name: APP_DS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-agent-secret
                  key: DS_TOKEN
            - name: APP_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ops-agent-secret
                  key: LLM_API_KEY
            - name: APP_DINGTALK_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: ops-agent-secret
                  key: DINGTALK_WEBHOOK
            - name: APP_CONFIG_PATH
              value: "/app/config/config.yaml"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: ops-agent-config
        - name: data
          persistentVolumeClaim:
            claimName: ops-agent-data

---
apiVersion: v1
kind: Service
metadata:
  name: ops-agent-service
  namespace: ops-agent
  labels:
    app: ops-agent
spec:
  type: ClusterIP
  selector:
    app: ops-agent
    component: core
  ports:
    - name: webhook
      port: 8081
      targetPort: 8081
      protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ops-agent-data
  namespace: ops-agent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent-sa
  namespace: ops-agent

---
# RBAC: 允许 Agent 操作 DS 命名空间下的资源
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-agent-role
  namespace: ds
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-agent-role-binding
  namespace: ds
subjects:
  - kind: ServiceAccount
    name: ops-agent-sa
    namespace: ops-agent
roleRef:
  kind: Role
  name: ops-agent-role
  apiGroup: rbac.authorization.k8s.io