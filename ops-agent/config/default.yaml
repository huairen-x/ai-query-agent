# 智能运维 Agent 默认配置
# 优先级: 默认值 < 此文件 < 环境变量 < 运行时参数

# --- DolphinScheduler 连接 ---
ds:
  host: "localhost"
  port: 12345
  api_prefix: "/dolphinscheduler"
  token: ""
  api_version: "v2"
  timeout: 30
  poll_interval: 30
  event_webhook_port: 8081

# --- Kubernetes ---
k8s:
  in_cluster: true
  kubeconfig_path: ""
  worker_deployment: "ds-worker"
  worker_namespace: "ds"
  default_scale_step: 2
  max_replicas: 20
  min_replicas: 3

# --- 异常检测 ---
detection:
  timeout_ratio_threshold: 1.5
  baseline_std_threshold: 3.0
  retry_threshold: 3
  cpu_high_threshold: 85.0
  queue_depth_threshold: 100
  min_samples_for_baseline: 7
  enable_ml_detection: true

# --- LLM 推理 ---
llm:
  provider: "deepseek"
  model: "deepseek-chat"
  api_key: ""
  api_base: ""
  temperature: 0.1
  max_tokens: 2000
  timeout: 60
  enable_reasoning: true

# --- 熔断器 ---
circuit_breaker:
  failure_threshold: 3
  recovery_timeout: 300
  half_open_max_retries: 2
  metrics_window: 3600

# --- 通知 ---
notification:
  dingtalk_webhook: ""
  wecom_webhook: ""
  sms_gateway: ""
  on_call_phone: ""
  enable_auto_notify: true
  p0_phone_alert: true

# --- 通用 ---
log_level: "INFO"
data_dir: "./data"
mock_mode: false