# ============================================================
# 智能运维 Agent - Docker Compose 本地开发
# 用法: docker-compose up -d
# ============================================================
version: "3.8"

services:
  ops-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: ops-agent:latest
    container_name: ops-agent
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # 运行模式
      - APP_MOCK_MODE=true
      - APP_LOG_LEVEL=INFO

      # LLM 配置（mock 模式可留空）
      - APP_LLM_PROVIDER=deepseek
      - APP_LLM_MODEL=deepseek-chat
      - APP_LLM_API_KEY=${APP_LLM_API_KEY:-}

      # DolphinScheduler（mock 模式可留空）
      - DS_HOST=localhost
      - DS_PORT=12345
      - DS_TOKEN=${DS_TOKEN:-}

      # 通知
      - APP_DINGTALK_WEBHOOK=${APP_DINGTALK_WEBHOOK:-}
    volumes:
      - ops-agent-data:/app/data
    command: ["--webhook", "--port", "8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ops-agent-data: