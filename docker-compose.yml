version: "3.8"

services:
  ai-query-agent:
    build: .
    container_name: ai-query-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MOCK_MODE=true
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
